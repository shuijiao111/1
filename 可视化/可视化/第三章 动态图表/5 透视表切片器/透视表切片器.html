<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>透视表切片器</title><style>
:root{color-scheme:dark;--bg:#1a1e43;--ink:#f5f5fa;--muted:#d1d4e8;--blue:#0070c0;--edge:#5e6384;--focus:#f5c353}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","SimHei",sans-serif}body{font-variant-numeric:tabular-nums}::selection{background:#0070c0;color:white}
main{max-width:1000px;margin:0 auto;padding:44px 0 24px}h1{font-size:34px;line-height:1.4;margin:0 55px;font-weight:700;letter-spacing:0}button,select,input{font:inherit}button,select{min-height:36px;border:1px solid #a4a6b4;border-radius:2px;padding:5px 13px;background:#f2f2f4;color:#171a31;cursor:pointer}button:hover,select:hover{background:#fff}button[aria-pressed="true"]{background:#0070c0;border-color:#4bb5f4;color:white}button:disabled{opacity:.45;cursor:default}input{accent-color:#0070c0}button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
.toolbar{display:flex;justify-content:flex-end;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 55px 4px;min-height:40px}.toolbar label{display:inline-flex;gap:7px;align-items:center;font-size:16px;cursor:pointer}.toolbar input{width:16px;height:16px;margin:0}.toolbar fieldset{display:flex;gap:14px;border:0;padding:0;margin:0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.legend-toolbar{justify-content:flex-start;gap:24px}.legend-toolbar label{padding:7px 12px;font-size:16px;color:white}.legend-toolbar label:nth-of-type(1){background:#0070c0}.legend-toolbar label:nth-of-type(2){background:#e74e69}.legend-toolbar label:nth-of-type(3){background:#ffc000;color:#182040}
.plot-wrap{width:100%;overflow-x:auto;scrollbar-color:#737aab #1a1e43;scrollbar-width:thin}.plot{display:block;width:100%;height:auto;touch-action:pan-x pan-y}.plot text{font-family:"Microsoft YaHei","SimHei",sans-serif;fill:var(--ink)}.mark{cursor:default;transition:filter .15s}.mark:hover,.mark:focus{filter:brightness(1.12)}.grid{stroke:#b7bed2;stroke-opacity:.20;stroke-width:1;stroke-dasharray:9 5}.axis{stroke:#5e6384;stroke-width:1}
footer{font-size:13px;color:var(--muted);margin:15px 50px 0;line-height:1.7}#tip{position:fixed;z-index:5;max-width:300px;padding:10px 13px;background:#f7f8fc;color:#172039;border:1px solid #9ba6cb;border-radius:4px;box-shadow:0 5px 18px #0005;font-size:14px;line-height:1.6;pointer-events:none;white-space:pre-line}#tip[hidden]{display:none}
.slicer{margin:0 55px 26px;border:1px solid #5e6384;padding:12px;background:#f1f2f7;color:#202439}.slicer-top{display:flex;align-items:center;gap:18px;justify-content:space-between;margin-bottom:12px}.slicer-top label{display:flex;align-items:center;gap:6px;font-size:14px}.slicer-top button{min-height:30px;font-size:13px}.departments{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.departments button{min-height:35px;font-size:15px;text-align:left}.slicer button[aria-pressed="false"]{background:#dce8f7;border-color:#92b4d7;color:#1c3553}.slicer button[aria-pressed="false"]:hover{background:#c7def8}.selection{font-size:14px;color:var(--muted);margin:8px 55px 0;min-height:20px}
@media(max-width:640px){main{padding-top:24px}h1{font-size:25px;margin:0 22px}.toolbar{margin:16px 22px 5px;gap:9px}.toolbar label{font-size:14px}.legend-toolbar{gap:8px}.legend-toolbar label{padding:6px 8px;font-size:14px}footer{margin:15px 22px;font-size:12px}.slicer{margin:0 22px 20px}.slicer-top{gap:7px;flex-wrap:wrap}.departments{grid-template-columns:repeat(2,1fr)}.selection{margin:8px 22px}.slicer-top strong{margin-right:auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><main><div class="slicer" role="group" aria-label="部门切片器"><div class="slicer-top"><strong>部门</strong><label><input type="checkbox" id="multi">多选</label><button type="button" id="clear">清除筛选</button></div><div class="departments"><button type="button" data-department="财务" aria-pressed="false">财务</button><button type="button" data-department="工程" aria-pressed="false">工程</button><button type="button" data-department="后勤" aria-pressed="false">后勤</button><button type="button" data-department="人力资源" aria-pressed="false">人力资源</button><button type="button" data-department="市场拓展" aria-pressed="false">市场拓展</button><button type="button" data-department="销售" aria-pressed="false">销售</button><button type="button" data-department="行政" aria-pressed="false">行政</button></div></div><h1 id="chart-title">各学历平均工资情况</h1><p id="selection" class="selection"></p>
<div class="plot-wrap" tabindex="0" aria-label="图表区域"><svg id="chart" class="plot" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="group" aria-label="交互图表"></svg></div>
<footer>*注：数据来源于人力资源管理系统，统计日期截至2022.03.31</footer><p id="status" class="sr-only" aria-live="polite"></p></main>
<div id="tip" role="tooltip" hidden></div><script id="source-data" type="application/json">{"labels": ["本科", "博士", "高中", "硕士", "专科"], "departments": ["财务", "工程", "后勤", "人力资源", "市场拓展", "销售", "行政"], "groups": {"财务": {"本科": [183935, 28], "博士": [4317, 1], "高中": [28914, 8], "硕士": [74127, 10], "专科": [17338, 5]}, "工程": {"本科": [0, 0], "博士": [0, 0], "高中": [3468, 1], "硕士": [0, 0], "专科": [0, 0]}, "后勤": {"本科": [0, 0], "博士": [0, 0], "高中": [2693, 1], "硕士": [0, 0], "专科": [0, 0]}, "人力资源": {"本科": [182535, 27], "博士": [14971, 3], "高中": [13883, 5], "硕士": [145667, 15], "专科": [67336, 15]}, "市场拓展": {"本科": [1411813, 230], "博士": [114992, 16], "高中": [427315, 73], "硕士": [1091720, 162], "专科": [822057, 119]}, "销售": {"本科": [1187693, 166], "博士": [132588, 15], "高中": [281365, 50], "硕士": [935006, 128], "专科": [567139, 87]}, "行政": {"本科": [761899, 121], "博士": [130459, 13], "高中": [201259, 32], "硕士": [472776, 83], "专科": [282044, 56]}}, "initial": ["市场拓展"]}</script><script>
const DATA=JSON.parse(document.getElementById('source-data').textContent);
const svg=document.getElementById('chart'), title=document.getElementById('chart-title'), status=document.getElementById('status'), tip=document.getElementById('tip');
const BG='#1a1e43', BLUE='#0070c0', PINK='#e74e69', GOLD='#ffc000';
const compact=()=>innerWidth<=640;
function fit(){svg.setAttribute('viewBox',`0 0 ${compact()?660:1000} 510`)}
fit();addEventListener('resize',()=>{fit();update()});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,d=0)=>Number(v).toLocaleString('en-US',{useGrouping:false,minimumFractionDigits:d,maximumFractionDigits:d});
const pct=v=>num(v*100,0)+'%';
const exactPct=v=>Number((v*100).toFixed(2))+'%';
function attrs(obj){return Object.entries(obj).map(([k,v])=>` ${k}="${esc(v)}"`).join('')}
function txt(x,y,s,size=19,anchor='middle',fill='#f5f5fa',more={}){return `<text${attrs({x,y,'font-size':size,'text-anchor':anchor,fill,...more})} style="fill:${fill}">${esc(s)}</text>`}
function line(x1,y1,x2,y2,color,width=1,more={}){return `<line${attrs({x1,y1,x2,y2,stroke:color,'stroke-width':width,...more})}/>`}
function rect(x,y,w,h,fill,more={}){return `<rect${attrs({x,y,width:w,height:Math.max(0,h),fill,...more})}/>`}
function circle(x,y,r,fill,more={}){return `<circle${attrs({cx:x,cy:y,r,fill,...more})}/>`}
function mark(label,value,extra={}){return {class:'mark',tabindex:0,role:'img','aria-label':label,'data-tip':label,'data-value':value,...extra}}
function polar(cx,cy,r,a){return [cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)]}
function ringPath(cx,cy,outer,inner,start,end){
    const a=polar(cx,cy,outer,start),b=polar(cx,cy,outer,end),c=polar(cx,cy,inner,end),d=polar(cx,cy,inner,start),large=end-start>180?1:0;
    return `M${a} A${outer},${outer} 0 ${large} 1 ${b} L${c} A${inner},${inner} 0 ${large} 0 ${d} Z`;
}
function ring(cx,cy,outer,inner,start,end,color,more={}){return `<path${attrs({d:ringPath(cx,cy,outer,inner,start,end),fill:color,...more})}/>`}
function options(el,values,selected){el.innerHTML=values.map(s=>`<option${s===selected?' selected':''}>${esc(s)}</option>`).join('')}
function announce(message){status.textContent=message;svg.setAttribute('aria-label',message)}
function defs(){return '<defs><linearGradient id="bar-gradient" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0070c0"/><stop offset="1" stop-color="#00b0f0"/></linearGradient></defs>'}
let animation=0,shown=[];
function animate(values,paint){
    cancelAnimationFrame(animation);tip.hidden=true;
    const from=shown.length===values.length?[...shown]:[...values];
    const duration=matchMedia('(prefers-reduced-motion: reduce)').matches?0:320;
    const start=performance.now();
    const frame=now=>{let t=duration?Math.min((now-start)/duration,1):1;let ease=1-Math.pow(1-t,3);shown=values.map((v,i)=>from[i]+(v-from[i])*ease);paint(shown,t===1);if(t<1)animation=requestAnimationFrame(frame)};
    frame(start);
}
function showTip(el,x,y){
    tip.textContent=el.dataset.tip;tip.hidden=false;
    tip.style.left=Math.max(8,Math.min(x+14,innerWidth-tip.offsetWidth-12))+'px';
    tip.style.top=Math.max(8,Math.min(y+12,innerHeight-tip.offsetHeight-12))+'px';
}
svg.addEventListener('pointermove',e=>{const el=e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY);else tip.hidden=true});
svg.addEventListener('pointerleave',()=>tip.hidden=true);
svg.addEventListener('focusin',e=>{const el=e.target.closest('[data-tip]');if(el){const b=el.getBoundingClientRect();showTip(el,b.x+b.width/2,b.y)}});
svg.addEventListener('focusout',()=>tip.hidden=true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')tip.hidden=true});

const multi=document.getElementById('multi'),selection=document.getElementById('selection');let selected=new Set(DATA.initial);
const buttons=[...document.querySelectorAll('[data-department]')];
function update(){
    buttons.forEach(b=>b.setAttribute('aria-pressed',String(selected.has(b.dataset.department))));
    const names=DATA.departments.filter(d=>selected.has(d)),counts=[],sums=[];
    DATA.labels.forEach((e,i)=>{sums[i]=0;counts[i]=0;names.forEach(d=>{sums[i]+=DATA.groups[d][e][0];counts[i]+=DATA.groups[d][e][1]})});
    const values=sums.map((s,i)=>counts[i]?s/counts[i]:null),maximum=Math.max(10000,Math.ceil(Math.max(0,...values.filter(v=>v!==null))/2500)*2500);
    selection.textContent=names.length===DATA.departments.length?'全部部门':(names.length?names.join('、'):'未选择部门');
    window.chartState={departments:names,labels:DATA.labels,values,counts,sums,maximum};announce(selection.textContent+' · 各学历平均月收入');
    animate(values.map(v=>v??0),vs=>{
        const base=460,h=405;let s=defs();
        for(let v=0;v<=maximum;v+=2500){const y=base-v/maximum*h;s+=line(compact()?65:80,y,compact()?610:930,y,'#b7bed2',1,{class:'grid'})}
        DATA.labels.forEach((l,i)=>{const x=compact()?115+i*110:165+i*168,y=base-vs[i]/maximum*h;
            if(values[i]!==null){s+=rect(x-(compact()?22:27),y,compact()?44:54,base-y,'url(#bar-gradient)',mark(`${l}\n平均月收入 ${num(values[i],2)}元\n${counts[i]}人`,values[i],{'data-category':l,'data-count':counts[i]}));s+=txt(x,y-20,num(values[i],2),19)}
            else if(names.length)s+=txt(x,base-25,'无数据',18);
            s+=txt(x,base+35,l,23);
        });
        if(!names.length)s+=txt(compact()?330:505,235,'请选择部门',24);svg.innerHTML=s;
    });
}
buttons.forEach(b=>b.addEventListener('click',e=>{const d=b.dataset.department;if(multi.checked||e.ctrlKey||e.metaKey){selected.has(d)?selected.delete(d):selected.add(d)}else selected=new Set([d]);update()}));
document.getElementById('clear').addEventListener('click',()=>{selected=new Set(DATA.departments);update()});
update();
</script></body></html>
