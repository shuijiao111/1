<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公司销售数据可视化看板</title>
<style>

<script>
const DATA=JSON.parse(document.getElementById('data').textContent),select=document.getElementById('month'),tip=document.getElementById('tooltip');
const WHITE='#f5f5fa',MUTED='#d1d7ee',BLUE='#4a5bd1',CYAN='#7bbdd5',PINK='#fc6c9d',TRACK='#545d83';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=2)=>Number(n).toLocaleString('en-US',{useGrouping:false,minimumFractionDigits:d,maximumFractionDigits:d});
const text=(x,y,s,size=14,anchor='middle',fill=WHITE,weight=400)=>`<text x="${x}" y="${y}" font-size="${size}" text-anchor="${anchor}" fill="${fill}" font-weight="${weight}">${esc(s)}</text>`;
const mark=(label,value)=>`class="mark" tabindex="0" role="img" aria-label="${esc(label)}" data-tip="${esc(label)}" data-value="${value}"`;
const rect=(x,y,w,h,fill,attr='')=>`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(0,h)}" fill="${fill}" ${attr}/>`;
const circle=(cx,cy,r,fill,attr='')=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" ${attr}/>`;
function point(cx,cy,r,deg){return [cx+r*Math.cos(deg*Math.PI/180),cy+r*Math.sin(deg*Math.PI/180)]}
function arc(cx,cy,r,inner,start,end,color,attr=''){
 if(end-start<.00001)return '';
 if(end-start>=359.9999)return `<circle cx="${cx}" cy="${cy}" r="${(r+inner)/2}" fill="none" stroke="${color}" stroke-width="${r-inner}" ${attr}/>`;
 const a=point(cx,cy,r,start),b=point(cx,cy,r,end),c=point(cx,cy,inner,end),d=point(cx,cy,inner,start),large=end-start>180?1:0;
 return `<path d="M${a} A${r},${r} 0 ${large} 1 ${b} L${c} A${inner},${inner} 0 ${large} 0 ${d} Z" fill="${color}" ${attr}/>`;
}
function ring(cx,cy,r,inner,ratio,color,label){return arc(cx,cy,r,inner,-90,270,TRACK)+arc(cx,cy,r,inner,-90,-90+360*Math.max(0,Math.min(1,ratio)),color,mark(label,ratio))}
function draw(id,s){const el=document.getElementById(id);el.innerHTML=s;el.classList.remove('refreshed');void el.getBoundingClientRect();el.classList.add('refreshed')}
function bars(id,labels,values,color,month){
 const base=140,h=105,max=Math.max(1,...values)*1.1;let s='';
 values.forEach((v,i)=>{const x=28+i*72,y=base-v/max*h;s+=rect(x-11,y,22,base-y,color,mark(`${month} · ${labels[i]}\n销量 ${v}`,v))+text(x,y-11,v,14)+text(x,162,labels[i],14)});draw(id,s);
}
function update(){
 const index=Number(select.value),d=DATA.months[index],prev=index?DATA.months[index-1]:null;
 const rate=d.sales?d.profit/d.sales:null,mom=prev&&prev.count?(d.count/prev.count-1):null;
 window.dashboardState={month:d.month,...d,rate,mom,previous:prev?{month:prev.month,count:prev.count}:null};tip.hidden=true;
 let s='',start=-90;
 d.category.forEach((v,i)=>{let end=start+v/d.count*360;const colors=[PINK,BLUE,'#f6a576'];
  s+=arc(136,116,85,72,start,end,colors[i],mark(`${d.month} · ${DATA.categories[i]}\n销量 ${v} · ${fmt(v/d.count*100)}%`,v));
  const [x,y]=point(136,116,102,(start+end)/2);s+=text(x,y+5,fmt(v/d.count*100,0)+'%',14);
  s+=rect(301,65+i*48,8,8,colors[i])+text(313,73+i*48,DATA.categories[i],13,'start');start=end;
 });s+=text(136,119,d.count,38)+text(136,148,'总销量',16);draw('product',s);
 const costTotal=d.cost.reduce((a,b)=>a+b,0),order=[0,2,3,1];
 document.getElementById('costs').innerHTML=order.map(i=>{const label=DATA.costCategories[i],value=d.cost[i],ratio=costTotal?value/costTotal:0;return `<div class="cost-item"><h3>${esc(label)}</h3><div class="cost-body"><svg class="cost-ring" viewBox="0 0 100 110" role="group" aria-label="${label}成本占比">${ring(50,53,43,37,ratio,CYAN,`${d.month} · ${label}成本\n${fmt(value)} · 占比 ${fmt(ratio*100)}%`)}${text(50,58,fmt(ratio*100)+'%',16)}</svg><div class="cost-text">${esc(label)}费用合计<strong>${fmt(value)}</strong></div></div></div>`}).join('');
 s='';const compMax=Math.max(d.count,prev?.count??0,1),len=236;
 s+=text(26,44,d.month,14,'end')+rect(41,27,len*d.count/compMax,18,CYAN,mark(`${d.month}销量 ${d.count}`,d.count))+text(49+len*d.count/compMax,42,d.count,14,'start');
 if(prev)s+=text(26,96,prev.month,14,'end')+rect(41,79,len*prev.count/compMax,18,BLUE,mark(`${prev.month}销量 ${prev.count}`,prev.count))+text(49+len*prev.count/compMax,94,prev.count,14,'start');
 else s+=text(41,94,'无上月数据',14,'start',MUTED);
 s+=text(364,42,mom===null?'—':fmt(mom*100)+'%',20,'middle',WHITE,700)+text(364,88,'环比',15);draw('comparison',s);
 s=text(149,24,'产品',13,'middle',MUTED)+text(301,24,'销售额(万)',13,'middle',MUTED)+text(377,24,'销量',13,'middle',MUTED);
 d.top.forEach((p,i)=>{const y=63+i*49,c=['#ffc655','#a5d9ff','#f6a576'][i];
  s+=rect(36,y-21,5,11,'#fc6c9d')+rect(45,y-21,5,11,'#4a5bd1')+circle(43,y-3,11,c)+text(43,y+2,i+1,13,'middle','#253055',700);
  const display=p.name.length>25?p.name.slice(0,24)+'…':p.name;
  s+=`<g ${mark(`${i+1}. ${p.name}\n销售额 ${fmt(p.sales)}万 · 销量 ${p.count}`,p.sales)}>${rect(65,y-20,206,29,'transparent')}${text(76,y+2,display,13,'start')}</g>`;
  s+=rect(279,y-18,45,28,BLUE)+text(301.5,y+2,fmt(p.sales),14)+text(377,y+2,p.count,14);
 });draw('ranking',s);
 s=ring(104,92,73,63,rate??0,PINK,`${d.month}利润率 ${rate===null?'无数据':fmt(rate*100)+'%'}`)+text(104,98,rate===null?'—':fmt(rate*100)+'%',32)+text(104,126,'利润率',14);
 s+=text(260,69,'利润额(万)',13)+text(347,71,fmt(d.profit),21,'middle',PINK,700)+text(260,93,'/',13)+text(260,119,'销售额(万)',13)+text(347,121,fmt(d.sales),21,'middle',PINK,700);
 s+=`<rect x="139" y="182" width="188" height="32" rx="12" fill="none" stroke="${BLUE}" stroke-width="2"/>`+text(233,204,'利润额占比销售额',18);draw('profit',s);
 const maxSales=Math.max(200,Math.ceil(Math.max(...DATA.months.map(m=>m.sales))/50)*50),base=170,left=47,right=410,top=24;
 const points=DATA.months.map((m,i)=>[left+i*(right-left)/11,base-m.sales/maxSales*(base-top)]);
 s='<defs><linearGradient id="area-fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4a5bd1"/><stop offset="1" stop-color="#4a5bd1" stop-opacity=".14"/></linearGradient></defs>';
 s+=`<path d="M${left},${base} L${points.map(p=>p.join(',')).join(' L')} L${right},${base}Z" fill="url(#area-fill)"/>`;
 for(let v=0;v<=maxSales;v+=50)s+=text(39,base-v/maxSales*(base-top)+4,fmt(v),12,'end');
 DATA.months.forEach((m,i)=>{const [x,y]=points[i];s+=text(x,196,m.month,12)+circle(x,y,8,'transparent',mark(`${m.month}销售额 ${fmt(m.sales)}万`,m.sales));if(i===index)s+=circle(x,y,3,CYAN,'pointer-events="none"')});draw('annual',s);
 bars('region',DATA.regions,d.region,CYAN,d.month);bars('courier',DATA.couriers,d.courier,PINK,d.month);
 document.getElementById('status').textContent=`${d.month}，总销量${d.count}，销售额${fmt(d.sales)}万，利润额${fmt(d.profit)}万。`;
}
select.innerHTML=DATA.months.map((m,i)=>`<option value="${i}"${i===DATA.initial?' selected':''}>${m.month}</option>`).join('');select.addEventListener('change',update);
function show(el,x,y){tip.textContent=el.dataset.tip;tip.hidden=false;tip.style.left=Math.max(8,Math.min(x+13,innerWidth-tip.offsetWidth-10))+'px';tip.style.top=Math.max(8,Math.min(y+12,innerHeight-tip.offsetHeight-10))+'px'}
document.addEventListener('pointermove',e=>{const el=e.target.closest('[data-tip]');if(el)show(el,e.clientX,e.clientY);else tip.hidden=true});
document.addEventListener('focusin',e=>{const el=e.target.closest('[data-tip]');if(el){const r=el.getBoundingClientRect();show(el,r.x+r.width/2,r.y)}});
document.addEventListener('focusout',()=>tip.hidden=true);document.addEventListener('keydown',e=>{if(e.key==='Escape')tip.hidden=true});window.addEventListener('blur',()=>tip.hidden=true);
update();
</script></body></html>
